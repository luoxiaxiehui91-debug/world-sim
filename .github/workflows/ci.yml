name: CI

# world-sim 回归门禁：4 个子系统各起一个 job。
# - kaiyang（开阳，可视化前端）：vitest
# - macro-sim（天璇，仿真引擎）：pytest
# - macro-ji（天玑，校准验证）：pytest
# - macro-scan（天枢，采集引擎）：pytest
#
# 全局 PYTHONUTF8=1：源码/测试大量中文 print 与断言消息，
# 否则在非 UTF-8 locale 的 runner 上会因 cp1252/ascii 编码错误挂起或崩溃。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  kaiyang:
    name: kaiyang (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kaiyang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kaiyang/package-lock.json
      - run: npm ci
      - name: vitest run
        run: npm run test
      - name: XSS sink 计数断言（防新增）
        # 基线（2026-09-16 CHG-20260916T233310 修复后实测）：
        #   ⓐ dangerouslySetInnerHTML = 3 —— ReportsPanel / TianxuanTab / FlatMapPanel，
        #      均为受控保留（其上游 renderMarkdown / tooltip 构建函数已全部转义）。
        #   ⓒ href={xxx.} 直接属性绑定 = 0 —— 所有外部 URL 必须走 sanitizeUrl()。
        #      （EventPopup 的 href={href} 是已消毒的局部变量，不含点号，不受影响）
        # ⚠️ 断言红了须人工评估该 sink 是否必要并同步更新基线 + 注释，**不得自动放宽**。
        # 详见红线 #81：「补丁只打在一条路径上，同族没跟着改」。
        run: |
          n=$(grep -ro --include=*.ts --include=*.tsx --exclude=*.test.ts --exclude=*.test.tsx 'dangerouslySetInnerHTML' src/ | wc -l)
          echo "dangerouslySetInnerHTML = $n (基线 3，已排除测试文件)"
          test "$n" -le 3
          m=$(grep -rn --include=*.tsx --exclude=*.test.tsx 'href={[a-zA-Z]*\.' src/ | wc -l)
          echo "href direct property binding = $m (基线 0，已排除测试文件)"
          test "$m" -eq 0

  macro-sim:
    name: macro-sim (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macro-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      - name: pytest
        # --timeout 为兜底：防止任何联网/阻塞测试无限挂起拖死 CI
        run: python -m pytest tests -q -p no:cacheprovider --timeout=120

  macro-ji:
    name: macro-ji (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: macro-ji
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      - name: pytest
        run: python -m pytest tests -q -p no:cacheprovider --timeout=120

  macro-scan:
    name: macro-scan (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: macro-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        # requirements.txt 含 zh_core_web_sm / feedparser 两个非 PyPI 包，
        # 已随 wheels/ 目录入库 → 用 --find-links 从本地 wheel 安装。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --find-links wheels
          pip install pytest pytest-timeout
      - name: pytest
        # 只跑 tests/（核心代码/tests 目前是 0 字节空壳）。
        # test_fetch_commodity_yahoo.py 有已知的可复现挂起（审计 finding 记录：
        # collect() 中 requests.get 未被 mock 拦截而真实发起 → 挂起），
        # 用 --ignore 排除；--timeout 作为其余测试的兜底。
        run: >
          python -m pytest tests -q -p no:cacheprovider --timeout=90
          --ignore=tests/test_fetch_commodity_yahoo.py
