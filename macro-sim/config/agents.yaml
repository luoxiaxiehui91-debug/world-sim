# agents.yaml — 12个宏观Agent配置
# 修改此文件需重新部署（bash deploy.sh macro-sim）；当前未热挂载（COPY 进镜像）
# 新增角色只需添加一条，代码无需改动（预留接口）

global:
  transmission_attenuation: 0.5   # 传导矩阵衰减系数：主delta × coeff × attenuation 传给下游
                                   # 0.5 = 传导强度减半，防止级联放大；调小→传导更弱，调大→联动更强

agents:
  - id: A1
    name: 美联储
    role: fed
    class: financial.FedAgent
    info_delay: 4        # 4个月延迟（政策会议节奏）
    activation_prob: 0.30
    knowledge_base_ref: "知识库/财经知识库/02_分析框架/央行决策框架.md"
    transmission_coefficients:
      to_A2: 0.60   # 美联储政策对商业银行信贷的传导
      to_A7: 0.45   # 美联储加息对新兴市场资本外流的传导
      to_A12: 0.55  # 美联储加息对日本套息平仓的传导
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A2
    name: 商业银行
    role: commercial_bank
    class: financial.CommercialBankAgent
    info_delay: 2
    activation_prob: 0.70
    transmission_coefficients:
      to_A3: 0.40   # 信贷收紧对对冲基金流动性的影响
      to_A10: 0.35  # 信贷收紧对散户情绪的传导
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A3
    name: 对冲基金
    role: hedge_fund
    class: financial.HedgeFundAgent
    info_delay: 0        # 即时，最灵敏
    activation_prob: 1.00
    transmission_coefficients:
      to_A6: 0.50   # 对冲基金做空是媒体的信号来源
      to_A10: 0.60  # 对冲基金行为直接影响散户跟风
      to_A5: 0.40   # 对冲基金做空触发机构降险
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A4
    name: 能源国(OPEC+)  [已由 S5_saudi 接管，activation=0 挂起]
    role: energy_gov
    class: sovereign.EnergyGovSovereignAgent
    # v2.2 C2：A4 处理采用方案②（保留条目 + activation=0 + 移除 soul_file）——回归最小
    # （删条目会让 report/forecast/narrative 引用 A4 的代码炸）；能源维度由 S5_saudi
    # 的 sovereign 分支承接；gm_resolve 硬编码分支保留但 A4 恒 HOLD 不产生 delta
    info_delay: 5        # 最慢，决策周期长
    activation_prob: 0   # 挂起：S5_saudi 接管能源维度
    transmission_coefficients:
      to_A8: 0.35   # 能源供给变化对中国经济的传导
      to_A7: 0.40   # 能源价格对新兴市场的冲击
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A5
    name: 机构投资者
    role: institution
    class: financial.InstitutionAgent
    info_delay: 2
    activation_prob: 0.60
    transmission_coefficients:
      to_A2: 0.30   # 机构降险时商业银行感知到流动性变化
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A6
    name: 媒体/舆论
    role: media
    class: social.MediaAgent
    # v2.2 D4：移除 soul_file: A6_russia.yaml——MediaAgent 不消费 soul，
    # 俄罗斯主权 soul 已由 S4_russia（SovereignAgent）独立承载
    info_delay: 1
    activation_prob: 0.80
    transmission_coefficients:
      to_A10: 0.70  # 媒体是散户行为的最主要驱动
      to_A5: 0.20   # 媒体报道对机构情绪的微弱影响
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A7
    name: 新兴市场央行
    role: em_central_bank
    class: geopolitical.EMCentralBankAgent
    info_delay: 3
    activation_prob: 0.40
    transmission_coefficients:
      to_A4: 0.25   # 新兴市场资本管制对大宗商品需求的影响
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A8
    name: 中国央行/财政
    role: china_pboc
    class: geopolitical.ChinaPBOCAgent
    info_delay: 3
    activation_prob: 0.50
    knowledge_base_ref: "知识库/财经知识库/02_按经济体/中国/"
    transmission_coefficients:
      to_A7: 0.48   # 中国信用扩张对新兴市场的传导（跨国联动矩阵）
      to_A4: 0.30   # 中国需求对能源国的传导
      to_A3: 0.28   # 中国政策对全球对冲基金的影响
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A9
    name: 美国财政部
    role: us_treasury
    class: financial.USTreasuryAgent
    info_delay: 4
    activation_prob: 0.30
    transmission_coefficients:
      to_A1: 0.40   # 财政政策与货币政策的协调/冲突
      to_A3: 0.35   # 财政刺激对市场情绪的提振
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A10
    name: 散户/羊群
    role: retail
    class: social.RetailAgent
    info_delay: 0        # 即时，最容易被驱动
    activation_prob: 0.90
    transmission_coefficients:
      to_A6: 0.40   # 散户情绪反过来影响媒体报道角度
      to_A2: 0.25   # 散户恐慌性挤兑影响商业银行
    params:
      sensitivity: 1.2  # 散户比专业机构更敏感
      threshold: 0.4
      magnitude: 0.8    # 但单个散户影响幅度小

  - id: A11
    name: 欧洲央行
    role: ecb
    class: financial.ECBAgent
    info_delay: 4
    activation_prob: 0.30
    knowledge_base_ref: "知识库/财经知识库/02_按经济体/欧元区/"
    transmission_coefficients:
      to_A7: 0.35   # 欧央行政策对新兴市场的溢出
      to_A12: 0.25  # 欧美联动影响日元套息
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: A12
    name: 日本央行
    role: boj
    class: financial.BOJAgent
    info_delay: 4
    activation_prob: 0.25
    knowledge_base_ref: "知识库/财经知识库/02_按经济体/日本/"
    transmission_coefficients:
      to_A3: 0.65   # 日本放弃YCC触发全球套息平仓，对冲基金最先感知
      to_A5: 0.50   # 套息平仓冲击机构投资者
      to_A7: 0.45   # 日元升值冲击新兴市场
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.5  # BOJ行动幅度大（YCC放弃是非线性事件）

  # ── A 类主权国家 Agent（v2.2 激活，核心层 5 个）────────────────
  # id 策略：S{1..n} 前缀，避开现有 A1-A12 撞车；role 用语义名
  # 试点参数（v2.2 B3）：info_delay=0（去冷却，确保 12 步内多次行动）+ activation_prob 0.30
  # transmission_coefficients（v2.2 C3）：显式配置向金融 Agent 的传导（缺失则无第二跳）
  # soul_file 指向重命名版（S4_russia/S5_saudi，见 souls/ 目录）

  - id: S1_usa
    name: 美国（主权）
    role: usa
    class: sovereign.SovereignAgent
    soul_file: A1_usa.yaml
    info_delay: 0        # 试点：去冷却
    activation_prob: 0.40   # 试点（验证后回调 0.15-0.25）
    transmission_coefficients:
      to_A3: 0.30   # 制裁/军事行动 → 对冲基金风险感知
      to_A10: 0.20  # 地缘紧张 → 散户情绪
      to_A1: 0.25   # 财政/军事支出 → 美联储决策环境
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: S2_china
    name: 中国（主权）
    role: china
    class: sovereign.SovereignAgent
    soul_file: A2_china.yaml
    info_delay: 0        # 试点：去冷却
    activation_prob: 0.40   # 试点（验证后回调 0.15-0.25）
    transmission_coefficients:
      to_A7: 0.25   # 中国地缘行动 → 新兴市场
      to_A3: 0.28   # 台海紧张 → 对冲基金
      to_A8: 0.30   # 主权决策 → 中国央行/财政联动
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: S3_eu
    name: 欧盟（主权）
    role: eu
    class: sovereign.SovereignAgent
    soul_file: A3_eu.yaml
    info_delay: 0        # 试点：去冷却
    activation_prob: 0.40   # 试点（验证后回调 0.15-0.25）
    transmission_coefficients:
      to_A2: 0.25   # 欧盟制裁/能源政策 → 商业银行
      to_A3: 0.30   # 欧盟行动 → 对冲基金
      to_A11: 0.25  # 财政协调 → 欧央行
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: S4_russia
    name: 俄罗斯（主权）
    role: russia
    class: sovereign.SovereignAgent   # v2.1 P1-3：复合行为体（军事/能源/信息战）→ 基类
    soul_file: S4_russia.yaml
    info_delay: 0        # 试点：去冷却
    activation_prob: 0.40   # 试点（验证后回调 0.15-0.25）
    transmission_coefficients:
      to_A4: 0.35   # 俄能源行动 → 能源国（A4 挂起，作为传导接收端存在）
      to_A6: 0.30   # 信息战 → 媒体
      to_A3: 0.25   # 欧洲方向行动 → 对冲基金
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0

  - id: S5_saudi
    name: 沙特-OPEC（主权）
    role: opec_core
    class: sovereign.EnergyGovSovereignAgent   # v2.1 P1-3：纯 OPEC 产量行为体 → 能源特化类
    soul_file: S5_saudi.yaml
    info_delay: 0        # 试点：去冷却
    activation_prob: 0.40   # 试点（验证后回调 0.15-0.25）
    transmission_coefficients:
      to_A4: 0.30   # 产量决策 → 能源国感知（A4 挂起，作为传导接收端存在）
      to_A7: 0.25   # 油价冲击 → 新兴市场
      to_A8: 0.20   # 油价 → 中国经济
    params:
      sensitivity: 1.0
      threshold: 0.5
      magnitude: 1.0
