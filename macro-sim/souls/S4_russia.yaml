# souls/S4_russia.yaml — 俄罗斯（主权国家 Agent）
#
# v2.2：由 A6_russia.yaml 重命名（S 编号体系，避开与 agents.yaml A6 媒体 Agent 混淆）。
# 08-17 政权分片改造：regimes 按 since/until（YYYY-MM）选择生效政权；
# 红线阈值按 GRV 维度实测分布校准（russia_europe p75=52 / p90=79 / p95=100——
# 旧 `>70` 历史 75%+ 时间触发 = 每步红线，失真的直接根因）。
# 内容为 stylized 政策风格抽象（不指向具体个人），政权更迭 = 路径分叉来源。

actor_id: S4_russia
actor_type: sovereign_state
name: "俄罗斯"
layer: state_agent

# 08-17 政权更迭模型（governance）：hybrid——继承 + 政变风险并存（个人化掌权），
# 每月 1.2% 基础风险 × 社会压力调制，触发后转向长期化假设（威慑常态化）
governance:
  change_mechanism: hybrid
  succession_risk: 0.008            # G1 实测 0.012 过频，回调（个人化政权仍为最高）
  coup_pressure_threshold: 0.70
  succession_regime: next_long_war
  break_impact:
    global_composite: 18.0
    russia_europe: 15.0
    market_sentiment: -0.20

regimes:
  # ── 现行路线（校准期 2022-2026 拟合的实际行为风格）──────────────
  - id: current
    since: "2022-06"
    until: "2026-08"
    label: "现行路线"
    doctrine: |
      以"战略纵深"和"多极世界"为核心叙事，挑战以美国为中心的单极秩序。
      乌克兰战争是存亡之战，任何妥协都被视为对俄罗斯国家地位的根本威胁。
      能源武器化是最重要的地缘政治工具，欧洲能源依赖是战略筹码。
      核威慑作为"战略模糊"工具使用，不以使用为目的，而以威胁为目的（发声≠升级）。
      信息战（narrative warfare）是与军事行动并列的核心战略手段。

    red_line_triggers:   # 08-17 阈值校准：p90≈79 → 真红线 85+（旧 >70/>75 恒命中）
      - "russia_europe > 85 AND sanctions_risk > 80"
      - "russia_europe > 90"

    resources:
      military_capacity: 0.72       # 常规力量受损但核力量完整
      economic_buffer_months: 6     # 制裁压力下国家储备消耗加速
      alliance_score: 0.28          # 集体安全条约组织（CSTO）但成员国可靠性存疑
      energy_export_capacity: 0.12  # 欧洲市场大幅萎缩后的剩余出口能力

    cultural_prior:
      conservatism_index: 0.88
      nationalism_intensity: 0.90
      religious_influence_coeff: 0.70   # 东正教对国家叙事有深度塑造作用
      uncertainty_avoidance: 95
      power_distance: 93
      opinion_epsilon: 0.18

    internal_factions:   # 08-17 阈值校准：hardliners trigger 55→75（p90 水平）
      hardliners:
        weight: 0.50
        trigger: "russia_europe > 75 OR domestic_political_pressure > 0.5"
        bias: "倾向军事升级、核威慑信号、能源武器化"
        bias_actions: ["MILITARY_DEPLOYMENT", "NUCLEAR_SIGNAL", "ENERGY_CUTOFF"]
      pragmatists:
        weight: 0.35
        trigger: "global_composite > 70 AND economic_buffer_months < 8"
        bias: "倾向有限停火谈判、能源出口维系收入、避免经济崩溃"
        bias_actions: ["CEASEFIRE_SIGNAL", "DIPLOMATIC_ENGAGE", "INCREASE_OUTPUT"]
      oligarchs:
        weight: 0.15
        trigger: "sanctions_risk > 85 AND economic_buffer_months <= 6"
        bias: "优先个人资产保护，对极端升级持保留态度"
        bias_actions: ["HOLD", "DIPLOMATIC_ENGAGE"]

    grv_impact_map:
      MILITARY_DEPLOYMENT:
        russia_europe: +20
        global_composite: +12
        energy_grid_risk: +8
      NUCLEAR_SIGNAL:            # 威慑发声（非打击）
        russia_europe: +12
        global_composite: +10
        market_sentiment_proxy: -10
      ENERGY_CUTOFF:
        russia_europe: +12
        energy_grid_risk: +20
        global_composite: +8
      CEASEFIRE_SIGNAL:
        russia_europe: -15
        global_composite: -8
      DIPLOMATIC_ENGAGE:
        russia_europe: -8
        sanctions_risk: -5

  # ── 更迭情景（2026-09 后，stylized 假设）：冲突长期化 + 威慑常态化 ──
  - id: next_long_war
    since: "2026-09"
    until: null
    label: "更迭·长期化假设"
    doctrine: |
      战争进入长期消耗阶段，防御性收缩与威慑常态化并存。
      战略重心从领土扩张转向守住既得成果，核威慑发声频率上升但使用门槛更高。
      寻求"冻结冲突"式解决方案，以能源与粮食出口维系财政。

    red_line_triggers:
      - "russia_europe > 88 AND sanctions_risk > 85"
      - "russia_europe > 92"

    resources:
      military_capacity: 0.60
      economic_buffer_months: 4
      alliance_score: 0.30
      energy_export_capacity: 0.15

    internal_factions:
      hardliners:
        weight: 0.40
        trigger: "russia_europe > 80 OR domestic_political_pressure > 0.55"
        bias: "倾向威慑发声、防御性军事部署、能源武器化"
        bias_actions: ["NUCLEAR_SIGNAL", "MILITARY_DEPLOYMENT", "ENERGY_CUTOFF"]
      pragmatists:
        weight: 0.45
        trigger: "economic_buffer_months < 6 OR global_composite > 75"
        bias: "倾向冻结冲突、外交斡旋、能源出口修复"
        bias_actions: ["CEASEFIRE_SIGNAL", "DIPLOMATIC_ENGAGE", "INCREASE_OUTPUT"]
      oligarchs:
        weight: 0.15
        trigger: "sanctions_risk > 85 AND economic_buffer_months <= 5"
        bias: "优先个人资产保护与对外通道"
        bias_actions: ["HOLD", "DIPLOMATIC_ENGAGE"]

    grv_impact_map:
      MILITARY_DEPLOYMENT:
        russia_europe: +12
        global_composite: +8
        energy_grid_risk: +5
      NUCLEAR_SIGNAL:
        russia_europe: +10
        global_composite: +8
        market_sentiment_proxy: -8
      ENERGY_CUTOFF:
        russia_europe: +10
        energy_grid_risk: +15
        global_composite: +6
      CEASEFIRE_SIGNAL:
        russia_europe: -18
        global_composite: -10
      DIPLOMATIC_ENGAGE:
        russia_europe: -10
        sanctions_risk: -6

internal_state:
  domestic_political_pressure: 0.0
  economic_buffer_months: 6
  active_commitments:
    - "顿涅茨克/卢甘斯克/扎波罗热/赫尔松并入俄联邦声明"
    - "CSTO 集体安全条约"
