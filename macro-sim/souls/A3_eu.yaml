# souls/A3_eu.yaml — 欧盟（集体主权 Agent）
#
# 对应 agents.yaml S3_eu。08-17 政权分片改造：regimes 时间分片 + 红线阈值校准
# （energy_grid_risk p75=64 p90=76 —— 旧 `>75` 约 10-25% 时间触发偏松，真红线取 82+）。
# 内容为 stylized 政策风格抽象（不指向具体个人），政权/领导层更迭 = 路径分叉来源。

actor_id: S3_eu
actor_type: sovereign_state
name: "欧盟（集体）"
layer: state_agent

regimes:
  # ── 现行路线（2022-2026）────────────────────────────────
  - id: current
    since: "2022-06"
    until: "2026-08"
    label: "现行路线"
    doctrine: |
      欧盟的战略文化以"规范性权力"为核心——优先通过规则、标准和多边框架而非武力实现目标。
      对俄制裁和能源独立是当前最高优先级，但内部协调成本极高（部分成员阻力）。
      跨大西洋关系是安全基石，但经济主权和战略自主正成为新共识。
      对华政策呈"三分法"：伙伴（气候）/ 竞争者（市场）/ 制度对手（价值观）。
      能源价格和通胀是内部政治稳定的最大变量。

    red_line_triggers:   # 08-17 校准：russia>85 合理保留；energy 75→82（p90=76 之上）
      - "russia_europe > 85"
      - "energy_grid_risk > 82"

    resources:
      military_capacity: 0.55       # 集体但分散，高度依赖北约/美国核保护伞
      economic_buffer_months: 14
      alliance_score: 0.76          # 北约 + G7，但内部分歧降低有效联盟强度
      energy_import_dependency: 0.42

    cultural_prior:
      conservatism_index: 0.45
      nationalism_intensity: 0.50
      religious_influence_coeff: 0.30
      uncertainty_avoidance: 65
      power_distance: 38

    internal_factions:   # 08-17 校准：制裁派 trigger russia 60→78（p90 水平）
      sanctions_hardliners:
        weight: 0.45
        trigger: "russia_europe > 78 OR us_china_strategic > 75"
        bias: "倾向跟随美国制裁立场、北约军事参与、对华出口管制"
        bias_actions: ["IMPOSE_SANCTIONS", "MILITARY_DEPLOYMENT", "ALLIANCE_REINFORCE"]
      strategic_autonomy:
        weight: 0.35
        trigger: "global_composite < 55 AND energy_grid_risk > 45"
        bias: "倾向独立外交斡旋、维护对华贸易、能源多元化投资"
        bias_actions: ["DIPLOMATIC_ENGAGE", "IMPOSE_SANCTIONS"]
      cohesion_guard:
        weight: 0.20
        trigger: "domestic_political_pressure > 0.4"
        bias: "优先内部团结，避免对敏感议题的激进立场"
        bias_actions: ["HOLD", "DIPLOMATIC_ENGAGE"]

    grv_impact_map:
      IMPOSE_SANCTIONS:
        sanctions_risk: +12
        russia_europe: +8
      MILITARY_DEPLOYMENT:
        global_composite: +5
        russia_europe: +8
      DIPLOMATIC_ENGAGE:
        russia_europe: -8
        sanctions_risk: -5
      ALLIANCE_REINFORCE:
        russia_europe: -6
        global_composite: -2
      ENERGY_CUTOFF:        # 能源反制（对俄）
        energy_grid_risk: +10
        russia_europe: +6

  # ── 更迭情景（2026-09 后）：防务一体化加速 + 战略自主增强 ──
  - id: next_unified
    since: "2026-09"
    until: null
    label: "更迭·防务一体化假设"
    doctrine: |
      战略自主从共识走向落地：联合防务采购、快速反应部队、独立能源走廊。
      对俄维持制裁共识但降低升级冲动，外交斡旋空间扩大。
      对美博弈从依赖转向对等：以市场准入为筹码换取安全自主。
      对华政策维持"三分法"但务实倾向上升（经济压力下合作动机增强）。

    red_line_triggers:
      - "russia_europe > 88"
      - "energy_grid_risk > 85"

    resources:
      military_capacity: 0.62
      economic_buffer_months: 15
      alliance_score: 0.72
      energy_import_dependency: 0.35

    internal_factions:
      sanctions_hardliners:
        weight: 0.35
        trigger: "russia_europe > 82 OR us_china_strategic > 80"
        bias: "倾向制裁维持、防务投入、对华管制"
        bias_actions: ["IMPOSE_SANCTIONS", "ALLIANCE_REINFORCE"]
      strategic_autonomy:
        weight: 0.45
        trigger: "global_composite < 60 OR energy_grid_risk > 40"
        bias: "倾向独立外交、能源多元、对华务实合作"
        bias_actions: ["DIPLOMATIC_ENGAGE", "INCREASE_OUTPUT"]
      cohesion_guard:
        weight: 0.20
        trigger: "domestic_political_pressure > 0.45"
        bias: "优先内部团结与民意"
        bias_actions: ["HOLD", "DIPLOMATIC_ENGAGE"]

    grv_impact_map:
      IMPOSE_SANCTIONS:
        sanctions_risk: +10
        russia_europe: +6
      MILITARY_DEPLOYMENT:
        global_composite: +4
        russia_europe: +6
      DIPLOMATIC_ENGAGE:
        russia_europe: -10
        sanctions_risk: -6
      ALLIANCE_REINFORCE:
        russia_europe: -7
        global_composite: -2

internal_state:
  domestic_political_pressure: 0.0
  economic_buffer_months: 14
  active_commitments:
    - "北约框架内集体防御"
    - "对俄制裁一揽子方案（多轮）"
