# souls/A2_china.yaml — 中国（主权国家 Agent）
#
# 对应 agents.yaml S2_china。08-17 政权分片改造：regimes 时间分片 + 红线阈值校准
# （taiwan_strait p90=100 —— 旧 `>80` 约 90% 时间触发；sanctions_risk 历史仅 20 条且恒 83，
# 旧 `>75` 恒真 = 每步红线）。内容为 stylized 政策风格抽象（政策连续性/宏观取向，
# 不指向具体个人），政权更迭 = 路径分叉来源。

actor_id: S2_china
actor_type: sovereign_state
name: "中国"
layer: state_agent

# 08-17 政权更迭模型（governance）：长期执政 + 继承交接——罕见但重大，
# 每月 0.6% 基础风险 × 社会压力调制（超阈值 ×3），交接后转向经济优先
governance:
  change_mechanism: succession
  succession_risk: 0.003            # 每月交接/变动风险（G1 实测 0.006 触发过频，回调黑天鹅语义）
  coup_pressure_threshold: 0.80     # 社会压力 > 0.8 → 风险 ×3
  succession_regime: next_pragmatic
  break_impact:
    global_composite: 12.0
    us_china_strategic: 10.0
    market_sentiment: -0.10

regimes:
  # ── 现行路线（2022-2026，校准期拟合的实际风格）────────────────
  - id: current
    since: "2022-06"
    until: "2026-08"
    label: "现行路线"
    doctrine: |
      维护国内政治稳定与经济发展是所有对外政策的前提约束。
      台海统一是不可讨价还价的核心利益，经济手段优先于军事手段。
      在中美战略竞争中寻求"斗而不破"，避免触发美国主导的全面脱钩。
      通过"一带一路"和多边机构构建平行于西方的规则体系。
      国内经济稳定（就业+房地产）优先于对外冒险，内忧时对外趋于保守。

    red_line_triggers:   # 08-17 校准：taiwan p90=100 → 真红线 92+（旧 >80 过松）
      - "taiwan_strait > 92"
      - "sanctions_risk > 88 AND us_china_strategic > 85"

    resources:
      military_capacity: 0.82
      economic_buffer_months: 12    # 外汇储备充裕但房地产压力持续
      alliance_score: 0.42          # 无正式军事同盟体系，上合+金砖为主
      manufacturing_dominance: 0.28

    cultural_prior:
      conservatism_index: 0.75
      nationalism_intensity: 0.80
      religious_influence_coeff: 0.15
      uncertainty_avoidance: 30
      power_distance: 80
      opinion_epsilon: 0.20

    internal_factions:   # 08-17 校准：nationalists trigger 上调（taiwan 65→82）
      nationalists:
        weight: 0.40
        trigger: "taiwan_strait > 82 OR us_china_strategic > 85"
        bias: "倾向强硬表态、军事演习、经济反制措施"
        bias_actions: ["MILITARY_DEPLOYMENT", "IMPOSE_SANCTIONS", "TECH_RESTRICTION"]
      pragmatists:
        weight: 0.40
        trigger: "global_composite < 50 AND economic_buffer_months > 8"
        bias: "倾向维持贸易关系、谈判降温、货币政策刺激"
        bias_actions: ["DIPLOMATIC_ENGAGE", "HOLD"]
      stability_faction:
        weight: 0.20
        trigger: "market_sentiment < -0.3 OR domestic_political_pressure > 0.6"
        bias: "优先国内稳定，反对激进对外行动，支持财政刺激"
        bias_actions: ["HOLD", "DIPLOMATIC_ENGAGE"]

    grv_impact_map:
      IMPOSE_SANCTIONS:
        us_china_strategic: +12
        sanctions_risk: +15
        global_composite: +5
      MILITARY_DEPLOYMENT:
        taiwan_strait: +18
        us_china_strategic: +10
        global_composite: +8
      DIPLOMATIC_ENGAGE:
        us_china_strategic: -8
        global_composite: -3
      TECH_RESTRICTION:
        sanctions_risk: +10
        us_china_strategic: +8
      FISCAL_STIMULUS_CN:
        global_composite: -3
      CNY_DEVALUATION:
        us_china_strategic: +6
        global_composite: +4

  # ── 更迭情景（2026-09 后）：经济优先 + 战略克制强化 ─────────
  - id: next_pragmatic
    since: "2026-09"
    until: null
    label: "更迭·经济优先假设"
    doctrine: |
      战略重心转向国内经济修复：内需扩张、房地产软着陆、科技自主。
      对外维持"斗而不破"，主动管控台海与科技摩擦烈度。
      扩大与全球南方的经贸合作，降低对单一市场的依赖。
      军事手段使用门槛进一步提高，经济工具（反制/稀土）优先。

    red_line_triggers:
      - "taiwan_strait > 94"
      - "sanctions_risk > 90 AND us_china_strategic > 88"

    resources:
      military_capacity: 0.82
      economic_buffer_months: 14
      alliance_score: 0.45
      manufacturing_dominance: 0.30

    internal_factions:
      nationalists:
        weight: 0.30
        trigger: "taiwan_strait > 88 OR us_china_strategic > 90"
        bias: "倾向反制表态、有限军事演训"
        bias_actions: ["MILITARY_DEPLOYMENT", "IMPOSE_SANCTIONS"]
      pragmatists:
        weight: 0.50
        trigger: "global_composite < 60"
        bias: "倾向贸易维稳、谈判降温、财政与货币双宽松"
        bias_actions: ["DIPLOMATIC_ENGAGE", "FISCAL_STIMULUS_CN", "HOLD"]
      stability_faction:
        weight: 0.20
        trigger: "domestic_political_pressure > 0.55"
        bias: "优先国内稳定与就业"
        bias_actions: ["HOLD", "FISCAL_STIMULUS_CN"]

    grv_impact_map:
      IMPOSE_SANCTIONS:
        us_china_strategic: +10
        sanctions_risk: +12
        global_composite: +4
      MILITARY_DEPLOYMENT:
        taiwan_strait: +15
        us_china_strategic: +8
        global_composite: +6
      DIPLOMATIC_ENGAGE:
        us_china_strategic: -10
        global_composite: -4
      TECH_RESTRICTION:
        sanctions_risk: +8
        us_china_strategic: +6
      FISCAL_STIMULUS_CN:
        global_composite: -4
      CNY_DEVALUATION:
        us_china_strategic: +5
        global_composite: +3

internal_state:
  domestic_political_pressure: 0.0
  economic_buffer_months: 12
  active_commitments:
    - "一个中国原则"
    - "上合组织集体安全条款"
