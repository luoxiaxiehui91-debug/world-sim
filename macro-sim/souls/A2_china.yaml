# souls/A2_china.yaml — 中国（主权国家 Agent）
#
# 对应 agent_taxonomy.md 中的 A2（中国），为 B+A/NOVEL 重写 Sprint 准备。
# 当前 agents.yaml 中 A8 是"中国央行/财政"——B+A/NOVEL 重写后
# A2 升级为完整主权 Agent，A8 合并为 A2 的内部货币政策派系。

actor_id: A2
actor_type: sovereign_state
name: "中国"
layer: state_agent

doctrine: |
  维护共产党执政合法性是所有对外政策的前提约束。
  台海统一是不可讨价还价的核心利益，经济手段优先于军事手段。
  在中美战略竞争中寻求"斗而不破"，避免触发美国主导的全面脱钩。
  通过"一带一路"和多边机构构建平行于西方的规则体系。
  国内经济稳定（就业+房地产）优先于对外冒险，内忧时对外趋于保守。

red_lines:
  - "台湾宣布正式独立"
  - "美国对中国发动金融制裁（SWIFT 切断或主权债违约）"
  - "香港大规模武装骚乱威胁驻港部队"
  - "南海军事基地遭受直接攻击"

resources:
  military_capacity: 0.82
  economic_buffer_months: 12    # 外汇储备约 3 万亿美元，但房地产压力持续
  alliance_score: 0.42          # 无正式军事同盟体系，上合+金砖为主
  manufacturing_dominance: 0.28 # 全球制造业产出占比

cultural_prior:
  conservatism_index: 0.75
  nationalism_intensity: 0.80
  religious_influence_coeff: 0.15    # 宗教政策严格管控，公共决策影响有限
  uncertainty_avoidance: 30          # Hofstede UAI（低：高度适应不确定性）
  power_distance: 80                 # Hofstede PDI（高：集中决策）
  opinion_epsilon: 0.20              # 低 epsilon：信息管控下舆论共识维持快，但一旦突破快速级联

internal_factions:
  nationalists:
    weight: 0.40
    trigger: "taiwan_strait > 65 OR us_china_strategic > 75"
    bias: "倾向强硬表态、军事演习、经济反制措施"
  pragmatists:
    weight: 0.40
    trigger: "global_composite < 50 AND economic_buffer_months > 8"
    bias: "倾向维持贸易关系、谈判降温、货币政策刺激"
  stability_faction:
    weight: 0.20
    trigger: "market_sentiment < -0.3 OR domestic_political_pressure > 0.6"
    bias: "优先国内稳定，反对激进对外行动，支持财政刺激"

grv_impact_map:
  IMPOSE_SANCTIONS:
    us_china_strategic: +12
    sanctions_risk: +15
    global_composite: +5
  MILITARY_DEPLOYMENT:
    taiwan_strait: +18
    us_china_strategic: +10
    global_composite: +8
  DIPLOMATIC_ENGAGE:
    us_china_strategic: -8
    global_composite: -3
  TECH_RESTRICTION:
    sanctions_risk: +10
    us_china_strategic: +8
  FISCAL_STIMULUS_CN:
    global_composite: -3     # 中国刺激→全球需求预期改善
  CNY_DEVALUATION:
    us_china_strategic: +6
    global_composite: +4

internal_state:
  domestic_political_pressure: 0.0
  economic_buffer_months: 12
  active_commitments:
    - "一个中国原则"
    - "上合组织集体安全条款"
