services:
  macro-scan:
    image: macro-scan:v8
    restart: unless-stopped
    networks:
      - worldsim_default

    ports:
      - "8899:8899"      # Web UI (Phase 3A)
      - "8900:8900"      # Control API (A3a)

    volumes:
      - ./核心代码:/app
      - ./entrypoint.sh:/entrypoint.sh
      - ./data:/workspace/data
      - ./docs:/workspace/docs
      - ./logs:/var/log/macro-scan
      - ./知识库:/workspace/知识库
      - ./config:/workspace/config

    env_file:
      - .env
    environment:
      - OPENCLAW_WORKSPACE=/workspace
      - FRED_API_KEY=${FRED_API_KEY}
      - SPACETRACK_ID=${SPACETRACK_ID}
      - SPACETRACK_PASS=${SPACETRACK_PASS}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY}
      - TZ=Asia/Shanghai
      - OUTBOUND_PROXY=${OUTBOUND_PROXY}
      - PROXY_URL=${PROXY_URL}
      - NAS_PROXY_URL=${NAS_PROXY_URL}
      - GDELT_PROXY=${GDELT_PROXY}
      # 08-18 P1-6 纪律补齐：PG-only 写开关 + 网络 + 控制面 token（.env 提供，占位不落明文）
      - WORLDSIM_SQLITE_OFF=1
      - WORLDSIM_APP_PW=${WORLDSIM_APP_PW}
      - CONTROL_TOKEN=${CONTROL_TOKEN}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - OPENAI_COMPAT_URL=${OPENAI_COMPAT_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      - OPENAI_COMPAT_KEY=${OPENAI_COMPAT_KEY}
      - USE_EXTERNAL_LLM=1
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_CMD_TOPIC=${NTFY_CMD_TOPIC}
      - NTFY_CMD_SECRET=${NTFY_CMD_SECRET}
      - EIA_API_KEY=${EIA_API_KEY}
      - RUN_ON_START=true
      - RSSHUB_URL=${RSSHUB_URL}
      - KAIYANG_ORIGIN=${KAIYANG_ORIGIN}
      - DASHBOARD_OUTPUT=/workspace/docs/macro_dashboard.html

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kaiyang:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - worldsim_default
    ports:
      - "8080:80"
    volumes:
      - ${KAIYANG_DIR}/dist:/usr/share/nginx/html:ro
      - ./data:/usr/share/nginx/data:ro
      - ${KAIYANG_DIR}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - macro-scan
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# 08-18 P1-6 纪律补齐：跨容器网络（PG 解析依赖 worldsim_default；禁手动 network connect）
networks:
  worldsim_default:
    external: true
