services:
  macro-scan:
    image: macro-scan:v8
    restart: unless-stopped
    networks:
      - worldsim_default

    ports:
      - "8899:8899"      # Web UI (Phase 3A)
      - "8900:8900"      # Control API (A3a)

    volumes:
      - /vol2/1000/software/macro-scan/核心代码:/app
      - /vol2/1000/software/macro-scan/entrypoint.sh:/entrypoint.sh
      - /vol2/1000/software/macro-scan/data:/workspace/data
      - /vol2/1000/software/macro-scan/docs:/workspace/docs
      - /vol2/1000/software/macro-scan/logs:/var/log/macro-scan
      - /vol2/1000/software/macro-scan/知识库:/workspace/知识库
      - /vol2/1000/software/macro-scan/config:/workspace/config

    environment:
      - OPENCLAW_WORKSPACE=/workspace
      - FRED_API_KEY=${FRED_API_KEY}
      - TZ=Asia/Shanghai
      - OUTBOUND_PROXY=http://192.168.31.108:7890
      # 08-18 P1-6 纪律补齐：PG-only 写开关 + 网络 + 控制面 token（.env 提供，占位不落明文）
      - WORLDSIM_SQLITE_OFF=1
      - WORLDSIM_APP_PW=${WORLDSIM_APP_PW}
      - CONTROL_TOKEN=${CONTROL_TOKEN}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_MODEL=deepseek-ai/DeepSeek-V4-Flash
      - OPENAI_COMPAT_URL=https://token-plan-cn.xiaomimimo.com/v1
      - OPENAI_COMPAT_KEY=${OPENAI_COMPAT_KEY}
      - OPENAI_COMPAT_MODEL=mimo-v2.5-pro
      - USE_EXTERNAL_LLM=1
      - NTFY_TOPIC=***REMOVED***
      - NTFY_CMD_TOPIC=***REMOVED***
      - NTFY_CMD_SECRET=${NTFY_CMD_SECRET}
      - EIA_API_KEY=${EIA_API_KEY}
      - RUN_ON_START=true
      - RSSHUB_URL=http://192.168.31.108:12000
      - DASHBOARD_OUTPUT=/workspace/docs/macro_dashboard.html

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kaiyang:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - worldsim_default
    ports:
      - "8080:80"
    volumes:
      - /vol2/1000/software/kaiyang/dist:/usr/share/nginx/html:ro
      - /vol2/1000/software/macro-scan/data:/usr/share/nginx/data:ro
      - /vol2/1000/software/kaiyang/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - macro-scan
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# 08-18 P1-6 纪律补齐：跨容器网络（PG 解析依赖 worldsim_default；禁手动 network connect）
networks:
  worldsim_default:
    external: true
