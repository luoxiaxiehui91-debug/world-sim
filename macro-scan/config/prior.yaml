# 填写日期：2026-07-30
# 填写者：Claude（待用户审核确认）
# 权重范围：0.05（最低保留）~ 0.40（最高上限）
# 逻辑：权重反映"该信源对该子类型的预测力"，不是相关性
# 格式：source_id -> 子类型ID -> weight + notes
#
# 子类型ID对照：见 19_预测目标类型体系_v1.0.md
# 1.x=台海 2.x=中东 3.x=俄欧 4.x=南亚 5.x=全球能源
# 6.x=全球货币政策 7.x=贸易/供应链 8.x=全球金融稳定
# 9.x=通胀/滞胀 10.x=政治动荡 11.x=卫生事件
# 12.x=气候/自然灾害 13.x=科技/AI地缘

