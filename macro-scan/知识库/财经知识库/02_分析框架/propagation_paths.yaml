    - step: 5
      event: IMF/世界银行介入谈判或制裁生效
      lag_days: 60
      magnitude: {base: 0, range: [-10, +15]}
      confidence: 0.45
      source: historical_data
      notes: 方向不确定：制裁加深危机，IMF救助可能触底反弹
  dampening_factors:
    - factor: 大国（中/美/俄）迅速表态支持新政权
      scale: 0.6
    - factor: 外汇储备超过6个月进口额
      scale: 0.7
  amplifying_factors:
    - factor: 西方国家宣布制裁+资产冻结
