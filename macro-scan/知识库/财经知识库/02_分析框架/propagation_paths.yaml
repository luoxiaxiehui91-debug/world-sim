#  MACRO 情景
# ══════════════════════════════════════════════════════════════

- id: macro_usd_debt
  scenario_type: MACRO
  subtype: UST
  label: 美债危机 → 美元信用下降 → 全球去美元化
  calibration_score: 0.30
  data_quality: 无直接先例，主要为估算
  causal_chain:
    - step: 1
      event: 美国信用评级下调 / 债务上限危机
      lag_days: 0
      magnitude: {base: -5, range: [-3, -12]}
      confidence: 0.65
      source: partial_historical
    - step: 2
      event: 美债收益率飙升（外国买家撤退）
      lag_days: 7
      magnitude: {base: 80, range: [30, 200]}
      confidence: 0.45
      source: llm_inference
    - step: 3
      event: 美元走弱，黄金/大宗商品上涨
      lag_days: 14
      magnitude: {base: 10, range: [5, 25]}
      confidence: 0.50
      source: partial_historical
    - step: 4
      event: 全球美元储备比例下降，人民币/欧元填补（多年进程）
      lag_days: 365
      magnitude: {base: -5, range: [-2, -15]}
      confidence: 0.30
      source: llm_inference
  dampening_factors:
    - factor: 美元仍为全球储备货币地位（缺乏替代品）
      scale: 0.60
    - factor: Fed 直接购债（美债买家 of last resort）
      scale: 0.55
  amplifying_factors:
    - factor: 中国/俄罗斯主导替代结算体系
      scale: 1.5
    - factor: 财政赤字持续超过 GDP 7%
      scale: 1.4
  historical_instances:
    - event: 2011 标普下调美国 AAA 评级
      outcome: SPX -20%，但美债收益率反而下降（避险需求），3个月后恢复
      verified: true
    - event: 2026-05 穆迪下调美国 Aaa → Aa1
      outcome: 市场短暂波动，后续持续观察中
      verified: false
  notes: >
    calibration_score 极低（0.30）。美元地位短期内无替代品，
    此路径为尾部风险，LLM 不得以此为定量分析主依据。

