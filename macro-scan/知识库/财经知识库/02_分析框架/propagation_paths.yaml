- id: emerging_market_political_currency_crisis
  scenario_type: POLITICAL
  subtype: INSTABILITY
  applicable_scenarios: [POLITICAL, GEO, SOCIAL]
  label: 新兴市场政治危机→货币崩溃→区域传染
  calibration_score: 0.50
  data_quality: mixed — step1-3有巴基斯坦/斯里兰卡/土耳其历史数据，step4依赖区域特征
  causal_chain:
    - step: 1
      event: 政治危机（政变/政府更迭/宪政冲突）→ 市场信心骤降
      lag_days: 0-14
      magnitude: {base: -15, range: [-5, -40], unit: "本国股市%"}
      confidence: 0.72
      source: historical_data
      notes: 土耳其里拉历次政治危机；巴基斯坦政权更迭→KSE指数波动±10~30%
    - step: 2
      event: 外资撤离→货币贬值→进口通胀
      lag_days: 14-60
      magnitude: {base: -20, range: [-10, -50], unit: "本币兑美元%"}
      confidence: 0.65
      source: historical_data
      notes: 巴基斯坦卢比2022-30%；土耳其里拉历次-20~-50%；需外储覆盖力评估
    - step: 3
      event: 通胀飙升→社会压力→政策难题（加息 vs 保增长）
      lag_days: 60-180
      magnitude: {base: "+20ppt通胀", range: ["+5ppt", "+80ppt"]}
      confidence: 0.60
      source: historical_data
      notes: 土耳其通胀峰值85%(2022)；巴基斯坦35%+(2022)；政策博弈放大不确定性
    - step: 4
      event: 区域传染效应（信心渠道→邻国资产承压）
      lag_days: 30-90
      magnitude: {base: -5, range: [-2, -15], unit: "区域新兴市场ETF%"}
      confidence: 0.40
      source: mixed
      notes: 传染效应依赖相似脆弱性；独立冲击传染有限，但多国同期压力时放大
  negative_conditions:
    - 有充足外汇储备（>6个月进口）：可直接干预汇率，阻断step2
    - 获得IMF/双边信用额度（沙特/中国援助巴基斯坦模式）
    - 大宗商品出口国：出口收入补充外储，缓冲贬值
    - 有效资本管制（阻断资本外逃）
  amplifying_factors:
    - factor: 外债占GDP > 40%（货币贬值→债务滚雪球）
      scale: 1.7
    - factor: 政治危机叠加气候/自然灾害（巴基斯坦2022双重打击）
      scale: 1.8
    - factor: 全球美元流动性收紧（美联储加息期，新兴市场普遍脆弱）
      scale: 1.4
  dampening_factors:
    - factor: 政权更迭后快速建立合法性（国际社会认可）
      scale: 0.5
    - factor: 国内强大的国有企业/银行体系（可直接干预外汇市场）
      scale: 0.6
  applicable_countries: emerging_markets_only（成熟民主国家效应压缩80%）
  historical_instances:
    - event: 2022 巴基斯坦政治危机+洪灾
      outcome: 卢比-30%；通胀+35%；外储耗尽；IMF救助
      verified_steps: [1, 2, 3]
    - event: 2022 土耳其通胀危机（政治独立货币政策）
      outcome: 里拉-44%；通胀峰值85%；选举前政策转向
      verified_steps: [1, 2, 3]
    - event: 2021 缅甸军政变
      outcome: FDI-70%；缅元-50%；国际制裁；step4传染效应极小（体量小）
      verified_steps: [1, 2]

