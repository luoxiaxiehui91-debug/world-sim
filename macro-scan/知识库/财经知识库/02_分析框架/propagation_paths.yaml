# propagation_paths.yaml — 宏观情景传导路径知识库
# M1-3：10条核心传导路径，供 hypothesis_engine.py 结构化注入 [PATHS] 节
# 热挂载文件，修改后立即生效（无需重启容器）
#
# 字段说明：
#   id:               唯一标识符
#   scenario_type:    对应 hypothesis_templates.yaml 情景类型
#   subtype:          情景子类型
#   label:            人可读名称
#   calibration_score: 综合置信度 [0-1]，经历史事件校验后可升级
#   data_quality:     数据来源质量说明
#   causal_chain:     传导链步骤列表
#     - step:           步骤编号
#       event:          触发事件描述
#       lag_days:       从上一步到本步的估算延迟（天）
#       magnitude:      {base: %, range: [低,高]}，百分比影响
#       confidence:     该步数据置信度 [0-1]
#       source:         数据来源类型
#   dampening_factors: 降温因素列表（含调制系数 scale）
#   amplifying_factors: 放大因素列表（含调制系数 scale）
#   historical_instances: 历史验证事件
#   notes:            额外说明

# ══════════════════════════════════════════════════════════════
#  GEO / TAIWAN 情景
# ══════════════════════════════════════════════════════════════

- id: geo_taiwan_diplomatic
  scenario_type: GEO
  subtype: TAIWAN
  label: 台海外交危机 → 市场恐慌 → 快速恢复
  calibration_score: 0.70
  data_quality: 历史数据（2022年佩洛西访台验证）
  causal_chain:
    - step: 1
      event: 外交紧张升级（言辞/演习/官员访台）
      lag_days: 0
      magnitude: {base: 5, range: [3, 12]}
      confidence: 0.80
      source: historical_data
    - step: 2
      event: VIX 跳升，台湾/科技股下跌，台币贬值
      lag_days: 1
      magnitude: {base: -8, range: [-3, -18]}
      confidence: 0.75
      source: historical_data
    - step: 3
      event: ADR 折价扩大，海外资本流出台湾
      lag_days: 3
      magnitude: {base: -5, range: [-2, -12]}
      confidence: 0.65
      source: historical_data
    - step: 4
      event: 外交降温（无军事行动），市场逐步消化
      lag_days: 14
      magnitude: {base: 6, range: [2, 14]}
      confidence: 0.70
      source: historical_data
  dampening_factors:
    - factor: 美国军事表态明确（航母部署）
      scale: 0.6
    - factor: 外交接触信号（电话/会晤）
      scale: 0.7
    - factor: 台积电生产无中断
      scale: 0.8
  amplifying_factors:
    - factor: 中国宣布实弹演习
      scale: 1.5
    - factor: 航运保险费上涨超 30%
      scale: 1.4
    - factor: 美国国会通过强硬法案
      scale: 1.3
  historical_instances:
    - event: 2022-08 佩洛西访台
      outcome: SPX -3.3%，台股 -3.8%，14天后基本恢复
      verified: true
    - event: 1996 台海危机（第三次）
      outcome: 台币贬值，台股 -15%，美航母介入后稳定
      verified: true
  notes: "此路径为外交危机，无实际军事接触。是 L1 烈度标准模板。"

- id: geo_taiwan_semiconductor
  scenario_type: GEO
  subtype: TAIWAN
  label: 台海封锁/冲突 → 半导体断供 → 全球工业链冲击
  calibration_score: 0.30
  data_quality: 混合（无直接先例，基于供应链分析）
  causal_chain:
    - step: 1
      event: 航运停滞 / 台积电设施受威胁
      lag_days: 0
      magnitude: {base: 0, range: [0, 0]}
      confidence: 0.90
      source: logical_inference
    - step: 2
      event: 全球半导体现货价格飙升，科技股暴跌
      lag_days: 7
      magnitude: {base: -25, range: [-15, -45]}
      confidence: 0.55
      source: supply_chain_analysis
    - step: 3
      event: 汽车/电子/数据中心厂商库存耗尽（3-6个月库存缓冲）
      lag_days: 90
      magnitude: {base: -8, range: [-5, -15]}
      confidence: 0.45
      source: industry_analysis
    - step: 4
      event: 全球 GDP 受拖累（制造业停产）
      lag_days: 180
      magnitude: {base: -2.5, range: [-1.5, -5]}
      confidence: 0.35
      source: llm_inference
    - step: 5
      event: 替代供应链重建（Intel/Samsung 扩产，耗时 3-5 年）
      lag_days: 1095
      magnitude: {base: 2, range: [1, 4]}
      confidence: 0.40
      source: llm_inference
  dampening_factors:
    - factor: 企业战略库存超过 6 个月
      scale: 0.7
    - factor: 三星/Intel 快速扩产
      scale: 0.75
    - factor: 冲突短暂（数天内停火）
      scale: 0.4
  amplifying_factors:
    - factor: 冲突持续超过 3 个月
      scale: 2.0
    - factor: 台积电厂房物理损毁
      scale: 3.0
    - factor: 美中全面脱钩（技术封锁）
      scale: 1.8
  historical_instances:
    - event: 2020-21 全球芯片短缺（COVID）
      outcome: 汽车减产 700 万辆，电子产品涨价，持续 18 个月
      verified: true
      note: 规模约为台积电断供情景的 10-15%
  notes: >
    台积电生产全球 ~90% 先进制程（≤7nm），无法在 3-5 年内建立替代产能。
    此路径是 L2/L3 烈度情景，calibration_score 低（0.30）表示不确定性极高。
    LLM 在引用本路径时必须明确标注数据来源层级。

- id: geo_taiwan_blockade
  scenario_type: GEO
  subtype: TAIWAN
  label: 台海封锁（无武装冲突）→ 航运停滞 → 慢冲击
  calibration_score: 0.25
  data_quality: LLM推断为主（无直接先例）
  causal_chain:
    - step: 1
      event: 解放军宣布"封锁演习"，保险公司停止承保台海航线
      lag_days: 0
      magnitude: {base: 0, range: [0, 0]}
      confidence: 0.85
      source: logical_inference
    - step: 2
      event: 航运绕道（马六甲→绕澳大利亚），运费+150%
      lag_days: 3
      magnitude: {base: -12, range: [-8, -20]}
      confidence: 0.50
      source: llm_inference
    - step: 3
      event: 台湾进出口受阻，台股下跌，台币大幅贬值
      lag_days: 7
      magnitude: {base: -20, range: [-12, -35]}
      confidence: 0.45
      source: llm_inference
    - step: 4
      event: 半导体出口中断，全球科技供应链库存逐渐消耗
      lag_days: 30
      magnitude: {base: -15, range: [-8, -30]}
      confidence: 0.35
      source: llm_inference
  dampening_factors:
    - factor: 国际社会外交压力
      scale: 0.7
    - factor: 台湾空中通道仍开放
      scale: 0.8
  amplifying_factors:
    - factor: 美国实施反封锁行动
      scale: 1.6
    - factor: 日本加入制裁
      scale: 1.4
  historical_instances: []
  notes: "封锁情景无直接历史先例。最接近参考：1973 石油禁运（但传导机制完全不同）。"

