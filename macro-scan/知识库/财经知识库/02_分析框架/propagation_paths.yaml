- id: energy_middle_east_oil
  scenario_type: ENERGY
  subtype: OIL
  label: 中东冲突 → 油价冲击 → CPI
  calibration_score: 0.82
  data_quality: 多历史案例充分验证（1973/1979/1990/2022）
  causal_chain:
    - step: 1
      event: 中东军事冲突/制裁宣布
      lag_days: 0
      magnitude: {base: 20, range: [10, 60]}
      confidence: 0.85
      source: historical_data
    - step: 2
      event: 油价飙升（地缘保险费 + 供给预期）
      lag_days: 1
      magnitude: {base: 15, range: [8, 40]}
      confidence: 0.85
      source: historical_data
    - step: 3
      event: CPI 能源分项上行，核心通胀受压
      lag_days: 45
      magnitude: {base: 0.8, range: [0.3, 2.0]}
      confidence: 0.75
      source: historical_data
    - step: 4
      event: Fed 政策转向（加息或暂停降息）
      lag_days: 90
      magnitude: {base: 0.5, range: [0.2, 1.5]}
      confidence: 0.65
      source: historical_data
    - step: 5
      event: 实体经济减速（消费/企业成本上升）
      lag_days: 120
      magnitude: {base: -1.0, range: [-0.5, -2.5]}
      confidence: 0.60
      source: historical_data
  dampening_factors:
    - factor: 美国页岩油增产（SPR 释放）
      scale: 0.65
    - factor: 全球需求疲软抵消供给冲击
      scale: 0.75
    - factor: 冲突快速停火
      scale: 0.40
  amplifying_factors:
    - factor: 霍尔木兹海峡关闭威胁
      scale: 2.0
    - factor: 伊朗全面制裁
      scale: 1.5
    - factor: 叠加全球需求复苏
      scale: 1.4
  historical_instances:
    - event: 1973 阿拉伯石油禁运
      outcome: 油价 +400%，美国 CPI +12.3%，衰退两年
      verified: true
    - event: 1990 海湾战争
      outcome: 油价 +100%（短暂），SPX -20%，3个月后战争结束反弹
      verified: true
    - event: 2022 俄乌战争
      outcome: 欧洲天然气 +400%，全球油价 +80%（后回落）
      verified: true
  notes: "传导机制最有历史数据支撑的路径之一。能源敏感度因国而异（欧洲>>美国）。"

