    - event: 2023-07 尼日尔政变
      outcome: ECOWAS制裁，铀出口中断，法国军队撤离，CFA外汇管制
      verified: true

- id: cultural_trade_boycott
  scenario_type: SOCIAL
  subtype: BOYCOTT
  label: 文化/政治冲突触发消费者抵制 → 目标企业营收下滑
  calibration_score: 0.55
  data_quality: 有量化锚点（2021新疆棉花事件为主锚点；韩国THAAD/澳中为辅助）
  notes: >
    本路径为"慢燃"路径，全链条时间跨度90-270天。
    关键触发门槛：纯民间自发抵制历史上3-6个月内消退，无持久经济影响。
    需官方媒体/政府机构背书（官媒转发/电商下架）才能规模化持续。
    step3-5 仅在官方背书确认时激活。
  causal_chain:
    - step: 1
      event: 文化/政治争议事件爆发（品牌声明/联署/代言人事件）
      lag_days: 0
      magnitude: {base: 0, range: [0, 0]}
      confidence: 0.85
      source: historical_data
    - step: 2
      event: 社交媒体抵制话题发酵，目标品牌声誉指数下滑
      lag_days: 3
      magnitude: {base: -10, range: [-3, -25]}
      confidence: 0.75
      source: historical_data
      notes: 2021新疆棉花：H&M声明发布后48小时微博话题量破10亿
    - step: 3
      event: 目标品牌在争议国家线上销售额下滑
      lag_days: 30
      magnitude: {base: -35, range: [-15, -70]}
      confidence: 0.65
      source: historical_data
      notes: H&M 2021Q2中国营收同比-62%；耐克同期因本地化程度高下滑较小
    - step: 4
      event: 竞争对手（本土品牌）市占率上升
      lag_days: 90
      magnitude: {base: +15, range: [+5, +30]}
      confidence: 0.55
      source: historical_data
      notes: 安踏/李宁H股涨幅15-30%
    - step: 5
      event: 目标企业调整对华战略（退出评估/本地化加深）
      lag_days: 180
      magnitude: {base: 0, range: [-5, +10]}
      confidence: 0.40
      source: historical_inference
      optional: true
  dampening_factors:
    - factor: 企业无官方背书，仅民间自发
      scale: 0.4
    - factor: 争议事件被后续更大新闻周期覆盖（注意力转移）
      scale: 0.4
  amplifying_factors:
    - factor: 官方媒体持续点名（央视/人民日报等）
      scale: 1.8
    - factor: 主要电商平台下架产品
      scale: 1.5
    - factor: 争议与国家核心利益叙事挂钩（主权/民族）
      scale: 2.0
  historical_instances:
    - event: 2021-03 新疆棉花事件（H&M、耐克、Burberry）
      outcome: H&M中国营收Q2同比-62%，李宁/安踏股价+15-30%，天猫/京东下架
      verified: true
    - event: 2017 韩国THAAD部署后中国抵制韩货
      outcome: 乐天超市被迫关店，韩国赴华游客-48%，韩流娱乐封禁
      verified: true

