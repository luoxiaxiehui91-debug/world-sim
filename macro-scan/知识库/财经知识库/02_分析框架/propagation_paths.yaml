- id: crisis_pandemic_supply
  scenario_type: CRISIS
  subtype: PANDEMIC
  label: 重大疫情 → 供应链断裂 → 通胀
  calibration_score: 0.72
  data_quality: 2020 COVID 充分验证
  causal_chain:
    - step: 1
      event: 重大疫情宣布 / 封控政策启动
      lag_days: 0
      magnitude: {base: -15, range: [-8, -35]}
      confidence: 0.85
      source: historical_data
    - step: 2
      event: 消费急剧萎缩（服务业），供应链中断
      lag_days: 14
