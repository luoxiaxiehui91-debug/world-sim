- id: political_instability_capital
  scenario_type: POLITICAL
  subtype: INSTABILITY
  label: 政治危机/政变 → 新兴市场资本外逃 → 主权债/货币崩溃
  calibration_score: 0.45
  data_quality: 部分历史数据（缅甸2021/巴基斯坦2022/尼日尔2023）
  applicability_scope: emerging_markets_only
  notes: >
    本路径仅适用于新兴市场政变/政治危机（Freedom House评分低于40分）。
    不适用于成熟民主国家政府更迭（如法国/德国换届）。
    触发建议：Freedom House评分<40 且 外汇储备月数<3个月。
  causal_chain:
    - step: 1
      event: 政变宣布/政权更迭/宪政危机爆发
      lag_days: 0
      magnitude: {base: 0, range: [0, 0]}
      confidence: 0.85
      source: historical_data
    - step: 2
      event: 银行挤兑/资本管制宣布/外国使馆撤员
      lag_days: 2
      magnitude: {base: -15, range: [-5, -40]}
      confidence: 0.70
      source: historical_data
      notes: 缅甸2021：军政府接管后72小时内银行ATM排队
    - step: 3
      event: 外资企业暂停新增投资/开始撤离
      lag_days: 14
