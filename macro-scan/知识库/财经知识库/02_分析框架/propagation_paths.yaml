- id: natural_disaster_supply_chain
  scenario_type: CRISIS
  subtype: EARTHQUAKE
  applicable_scenarios: [CRISIS]
  label: 极端自然灾害→供应链中断→行业冲击
  calibration_score: 0.58
  data_quality: mixed — step1-2有充分历史数据，step3依赖灾害地点的关键性
  causal_chain:
    - step: 1
      event: 超强自然灾害（地震M≥7.5/5级台风）→ 当地基础设施瘫痪
      lag_days: 0-7
      magnitude: {base: -15, range: [-5, -30], unit: "受灾地区GDP%"}
      confidence: 0.85
      source: historical_data
      notes: 局部基础设施损毁；港口/工厂短暂停工；人员疏散
    - step: 2
      event: 关键供应链节点停产→全球下游行业减产
      lag_days: 7-30
      magnitude: {base: -8, range: [-2, -20], unit: "受影响行业股价%"}
      confidence: 0.65
      source: historical_data
      notes: 仅当灾害打击全球稀缺供应节点时触发（如台湾晶圆/日本汽车零件/荷兰化工港）；普通震区不触发
    - step: 3
      event: 重建需求拉动→建材/工程设备需求上升
      lag_days: 30-180
      magnitude: {base: +20, range: [+10, +40], unit: "建材/钢材价格%"}
      confidence: 0.70
      source: historical_data
      notes: 重建效应通常对冲部分GDP损失；1-2年后受灾国GDP可能高于基准
  negative_conditions:
    - 震中/风眼远离工业区（农村/海洋）：冲击局限于当地，全球市场1周内消退
    - 受灾国为小型经济体：损失规模不足以影响全球定价
    - 供应链有冗余替代：其他地区产能可快速填补
    - 充分保险覆盖（成熟市场）：损失被保险机制快速消化
  amplifying_factors:
    - factor: 震中在台湾/日本/韩国半导体产区
      scale: 2.0
      notes: 全球晶圆/芯片单一供应节点，无法快速替代
    - factor: 涉及核电设施（福岛模式）
      scale: 1.8
      notes: 核事故是主要放大器，同等震级有无核事故冲击差距巨大
    - factor: 主要港口（鹿特丹/横滨/高雄）受损
      scale: 1.5
  dampening_factors:
    - factor: 灾区有完善的地震保险制度
      scale: 0.5
    - factor: 震中在经济欠发展地区
      scale: 0.3
  historical_instances:
    - event: 2011-03 日本东日本大地震（M9.0+核事故）
      outcome: 日经-15%（4天），全球汽车/半导体供应链中断2-3个月，日元套利平仓
      verified_steps: [1, 2, 3]
      notes: 核事故是最大放大器，没有核事故冲击会小得多
    - event: 2023-02 土耳其卡赫拉曼马拉什地震（M7.8）
      outcome: 土耳其股市-10%（短暂），全球市场1周内消退，重建支出提振通胀
      verified_steps: [1]
      notes: 非关键供应链节点，全球传导有限；政治经济学放大国内影响
    - event: 2004-12 印度洋海啸（M9.1）
      outcome: 全球股市1周内恢复，区域旅游/渔业损失严重，死亡>22万但金融冲击有限
      verified_steps: [1]
      notes: 典型反例：超强灾害 + 非工业区 = 全球市场不受影响

- id: earthquake_nuclear_cascade
  scenario_type: CRISIS
  subtype: EARTHQUAKE
  applicable_scenarios: [CRISIS, ENERGY]
  label: 地震+核事故→能源替代→天然气/煤炭需求激增
  calibration_score: 0.65
  data_quality: historical_data — 2011年日本完整验证全链路
  causal_chain:
    - step: 1
      event: 重大地震→核电站紧急停堆或事故
      lag_days: 0-3
      magnitude: {base: "核电出力-0~100%", range: ["视受损程度"]}
      confidence: 0.80
      source: historical_data
      notes: M≥7.0 地震通常触发核电自动停堆（SCRAM），损毁程度视震中距离
    - step: 2
      event: 核电缺口→电力紧缺→能源替代需求
      lag_days: 3-30
      magnitude: {base: +30, range: [+15, +80], unit: "LNG/天然气价格%"}
      confidence: 0.70
      source: historical_data
      notes: 日本2011：核电从30%→0%；欧洲进口LNG需求激增；天然气价格飙升
    - step: 3
      event: 受影响国弃核讨论→邻国能源政策调整
      lag_days: 30-365
      magnitude: {base: +10, range: [+5, +30], unit: "全球LNG长期合同价%"}
      confidence: 0.50
      source: historical_data
      notes: 德国2011年宣布弃核→欧洲天然气需求长期抬升；政策效应持续多年
    - step: 4
      event: 能源价格上涨→欧/亚通胀压力→央行政策权衡
      lag_days: 90-365
      magnitude: {base: +0.3, range: [+0.1, +1.0], unit: "CPI同比百分点"}
      confidence: 0.45
      source: mixed
  negative_conditions:
    - 核电占比低于10%（影响有限）
    - 周边地区 LNG/天然气储备充足
    - 快速重启其他类型发电（水电/风电可弥补缺口）
    - 震中距核电站 > 200km
  amplifying_factors:
    - factor: 受灾国核电占比 > 20%（法国/日本/韩国）
      scale: 1.8
    - factor: 事发在冬季能源消费高峰
      scale: 1.5
    - factor: 核事故引发其他国家同步关停同型核电机组
      scale: 1.6
      notes: 2011年德国/意大利/瑞士同步宣布暂停或退出核能
  historical_instances:
    - event: 2011-03 日本东日本大地震→福岛核事故
      outcome: 日本核电出力 30%→0%；LNG进口+50%；欧洲天然气+20%；德国宣布弃核
      verified_steps: [1, 2, 3, 4]
      notes: 迄今最完整的地震→核→能源→通胀链路验证案例

