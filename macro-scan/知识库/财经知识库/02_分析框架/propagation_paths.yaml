      confidence: 0.80
      source: historical_data
    - step: 3
      event: V 型需求反弹（财政刺激叠加），供给端恢复滞后
      lag_days: 90
      magnitude: {base: 5, range: [2, 12]}
      confidence: 0.70
      source: historical_data
    - step: 4
      event: 通胀急升（供给不足 + 需求过热）
      lag_days: 180
      magnitude: {base: 3, range: [1.5, 6]}
      confidence: 0.75
      source: historical_data
    - step: 5
      event: 央行收紧货币（与步骤4形成政策滞后）
