- id: climate_social_political_cascade
  scenario_type: CLIMATE
  applicable_scenarios: [CLIMATE, SOCIAL, POLITICAL]
  label: 气候冲击→社会压力→政治危机级联
  calibration_score: 0.52
  data_quality: mixed — step1-2有FAO/USDA历史数据，step3-4依赖国家脆弱性评分
  causal_chain:
    - step: 1
      event: 极端天气确认 → 主产区减产预期
      lag_days: 30-90
      magnitude: {base: -10, range: [-5, -20]}
      confidence: 0.75
      source: historical_data
      notes: FAO/USDA季度产量预测驱动；强厄尔尼诺东南亚大米减产典型-5%~-15%
    - step: 2
      event: 减产预期 → 粮食期货价格跳升
      lag_days: 0-30
      magnitude: {base: +15, range: [+5, +40]}
      confidence: 0.78
      source: historical_data
      notes: 期货市场领先实物约1个月；2010-11小麦+74%，2022-23大米+15%
    - step: 3
      event: 粮食价格→新兴市场进口通胀→实际工资下降→社会不满积累
      lag_days: 90-180
      magnitude: {base: "+20分社会压力指数（基尼>0.45国家）"}
      confidence: 0.55
      source: mixed
      notes: 2010-11拉尼娜验证step1-3；弹性系数因国而异（埃及0.8，印尼0.4）
    - step: 4
      event: 社会不满达临界 → 街头抗议或政治危机（条件分叉）
      lag_days: 180-365
      magnitude: {base: "Freedom House稳定性-15分"}
      confidence: 0.35
      source: llm_inference
      notes: ⚠️ 高度依赖国家脆弱性；外储<3个月+Freedom House<40时触发概率显著上升
  negative_conditions:
    - 全球粮食库存/消费比 > 20%（2016超强厄尔尼诺反例：气候极端但无社会危机）
    - 受影响国外储 > 6个月进口额
    - 政府有财力实施粮食补贴或价格管制
    - 受影响产区有替代出口国可部分对冲
  dampening_factors:
    - factor: 政府快速补贴干预
      scale: 0.4
    - factor: 全球粮食储备充足（库存/消费比>20%）
      scale: 0.3
  amplifying_factors:
    - factor: 四维脆弱性（基尼/青年失业/外储/Freedom House）≥3/4触红
      scale: 1.8
    - factor: 同期货币贬值（进口通胀叠加）
      scale: 1.4
    - factor: 气候冲击持续2个以上季度
      scale: 1.3
  applicable_countries: primarily emerging_markets（成熟民主国家effect压缩70%）
  historical_instances:
    - event: 2010-11 拉尼娜→埃及/突尼斯阿拉伯之春
      outcome: 埃及小麦价格上涨+74%，CPI+18%，2-4月后街头抗议，政府倒台
      verified_steps: [1, 2, 3]
      notes: 外储仅2个月，食品补贴压力过大，触发完整链条
    - event: 2016 超强厄尔尼诺（反例）
      outcome: 粮食价格温和上涨，无显著社会冲击
      verified_steps: [1, 2]
      notes: 关键：全球库存/消费比>22%，链条在step2后断裂

- id: social_political_capital_flight
  scenario_type: SOCIAL
  applicable_scenarios: [SOCIAL, POLITICAL]
  label: 社会压力→政治不稳→资本外逃反馈环
  calibration_score: 0.48
  data_quality: mixed — step1-2部分历史数据，step3有完整验证
  causal_chain:
    - step: 1
      event: 持续社会压力（>3个月）→ 外资持观望态度
      lag_days: 30-60
      magnitude: {base: -15, range: [-5, -30]}
      confidence: 0.65
      source: mixed
      notes: 香港2019：FDI流入放缓，外资撤离开始于抗议持续第2个月
    - step: 2
      event: 政治应对失当（加重镇压或政策混乱）→ 外资主动撤离
      lag_days: 60-180
      magnitude: {base: -30, range: [-10, -70]}
      confidence: 0.50
      source: mixed
      notes: 分叉点：政府有效应对（香港结果）vs 失当（斯里兰卡结果）
    - step: 3
      event: 资本外逃→货币贬值→进口通胀→加剧社会压力（正反馈）
      lag_days: 30-90
      magnitude: {base: -25, range: [-10, -50]}
      confidence: 0.55
      source: historical_data
      notes: 斯里兰卡2022：外储耗尽→卢比贬值30%→进口能源中断→社会崩溃完整验证
  negative_conditions:
    - 有效的资本管制法律（中国/印度可封堵大部分资本外流）
    - 政权更迭被国际社会快速承认（正统性恢复，降低不确定性）
    - 外储充足（央行可直接干预汇率，如香港外管局）
    - 大宗商品出口持续创汇（外储补充速度>消耗速度）
  dampening_factors:
    - factor: 有效资本管制
      scale: 0.3
    - factor: 国际社会援助/IMF协议
      scale: 0.5
  amplifying_factors:
    - factor: 美元外债占GDP > 30%（贬值→债务重压放大）
      scale: 1.6
    - factor: 无资本管制（资金自由流动）
      scale: 1.4
    - factor: 国际评级机构下调主权信用
      scale: 1.3
  historical_instances:
    - event: 2019-20 香港反修例（step1-2部分验证）
      outcome: 外资观望，FDI放缓，但外储充足+联系汇率制度阻断step3
      verified_steps: [1]
    - event: 2022 斯里兰卡债务+社会危机（完整验证）
      outcome: 外储耗尽→货币贬值30%→能源进口中断→政府倒台
      verified_steps: [1, 2, 3]

