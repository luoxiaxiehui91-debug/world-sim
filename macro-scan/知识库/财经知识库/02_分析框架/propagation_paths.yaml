atomic_paths:
  - id: climate_to_food_price
    from: CLIMATE
    to: COMMODITY_FOOD
    mechanism: 极端天气→主产区减产→粮食期货价格上涨
    calibration_score: 0.78
    lag_days: 0-30
    notes: 期货市场领先实物约1个月

  - id: food_price_to_em_inflation
    from: COMMODITY_FOOD
    to: MACRO_INFLATION
    mechanism: 进口粮食价格上涨→食品CPI上涨（进口依赖国）
    calibration_score: 0.65
    lag_days: 30-90
    notes: 弹性系数：埃及0.8/印尼0.4/印度0.2（取决于进口依存度）

  - id: inflation_to_social_stress
    from: MACRO_INFLATION
    to: SOCIAL_STRESS
    mechanism: 实际工资购买力下降→生活成本压力→社会不满
    calibration_score: 0.55
    lag_days: 90-180
    notes: 基尼系数>0.45时效果放大1.5倍；有效补贴可完全断开此传导

  - id: social_stress_to_capital_flight
    from: SOCIAL_STRESS
    to: MACRO_CAPITAL
    mechanism: 社会动荡持续→外资风险溢价上升→资本撤离
    calibration_score: 0.50
    lag_days: 60-180

  - id: capital_flight_to_currency
    from: MACRO_CAPITAL
    to: MACRO_CURRENCY
    mechanism: 资本账户净流出→本币需求下降→汇率贬值
    calibration_score: 0.72
    lag_days: 0-30
    notes: 无资本管制时传导极快；有管制时可能延迟或完全阻断

