- id: social_unrest_regime
  scenario_type: SOCIAL
  subtype: UNREST
  label: 大规模社会动乱 → 政权稳定性压力 → 资本外流/货币危机
  calibration_score: 0.45
  data_quality: 部分历史数据（香港2019/法国黄背心 step1-2验证；step3-5为llm_inference）
  applicability_scope:
    primary: non-OECD（新兴市场、威权政体）
    secondary: OECD（法国黄背心级别，影响幅度压缩50%）
  causal_chain:
    - step: 1
      event: 持续街头抗议（>10万人，>7天）
      lag_days: 0
      magnitude: {base: -4, range: [-2, -8]}
      confidence: 0.65
      source: historical_data
      notes: 香港2019恒指-12%（3个月），法国2018 CAC40-3.5%
    - step: 2
      event: 外资观望/短期资本外流，本币承压
      lag_days: 7
      magnitude: {base: -3, range: [-1, -9]}
      confidence: 0.60
      source: historical_data
    - step: 3
      event: 政权应对分叉（镇压/妥协/政权更迭）
      lag_days: 30
      magnitude: {base: 0, range: [-15, +8]}
      confidence: 0.35
      source: llm_inference
      notes: 历史样本结局差异极大，强制低置信分叉节点
    - step: 4
      event: 货币危机或资本管制（政权更迭情景）
      lag_days: 60
      magnitude: {base: -12, range: [-5, -35]}
      confidence: 0.30
      source: llm_inference
    - step: 5
      event: 国际援助/IMF介入后企稳
      lag_days: 180
      magnitude: {base: +6, range: [+2, +15]}
      confidence: 0.25
      source: llm_inference
  dampening_factors:
    - factor: 政府快速实质性让步
      scale: 0.5
    - factor: OECD成熟民主体制
      scale: 0.4
  amplifying_factors:
    - factor: 军队介入或暴力镇压
      scale: 1.8
    - factor: 多城市同步爆发
      scale: 1.4
  historical_instances:
    - event: 2019-06 香港反修例运动
      outcome: 恒指-12%（峰值），港元联系汇率防线承压，外资部分撤出
      verified: true
    - event: 2018-11 法国黄背心运动
      outcome: CAC40-3.5%（1个月），旅游业损失约20亿欧元
      verified: true
  notes: "step3分叉警告：香港维稳 vs 阿拉伯之春政权更迭结局差异过大，step3以下不作point estimate"

