- id: fin_banking_crisis
  scenario_type: FIN
  subtype: BANKING
  label: 银行危机 → 信用收缩 → 衰退
  calibration_score: 0.80
  data_quality: 2008 / 2023 有充分验证
  causal_chain:
    - step: 1
      event: 银行挤兑/流动性危机爆发（单家或系统性）
      lag_days: 0
      magnitude: {base: -10, range: [-5, -25]}
      confidence: 0.85
      source: historical_data
    - step: 2
      event: 银行间利率飙升（TED 利差扩大），信贷市场冻结
      lag_days: 3
      magnitude: {base: 150, range: [50, 500]}
      confidence: 0.80
      source: historical_data
    - step: 3
      event: 贷款收紧，企业/居民信用条件恶化
      lag_days: 30
      magnitude: {base: -3, range: [-1.5, -8]}
      confidence: 0.75
      source: historical_data
    - step: 4
      event: 消费和投资收缩，就业减少
      lag_days: 90
      magnitude: {base: -2, range: [-1, -5]}
      confidence: 0.70
      source: historical_data
  dampening_factors:
    - factor: Fed 紧急降息 + 流动性工具（BTFP/TARP）
      scale: 0.50
    - factor: FDIC 快速接管（系统性恐慌消除）
      scale: 0.55
  amplifying_factors:
    - factor: 多家银行同时倒闭
      scale: 2.0
    - factor: 主权债务危机叠加
      scale: 1.8
  historical_instances:
    - event: 2008 全球金融危机（雷曼倒闭）
      outcome: SPX -55%，失业率 10%，衰退 18 个月
      verified: true
    - event: 2023 硅谷银行危机
      outcome: 区域银行股跌 40%，Fed BTFP 介入后稳定，未蔓延系统性
      verified: true
  notes: ""

