- id: geo_us_china_trade
  scenario_type: TRADE
  subtype: CHIP
  label: 中美制裁/关税 → 科技股传导 → 供应链重构
  calibration_score: 0.70
  data_quality: 2018-19 贸易战有充分历史数据
  causal_chain:
    - step: 1
      event: 新一轮关税/出口管制宣布
      lag_days: 0
      magnitude: {base: -5, range: [-3, -10]}
      confidence: 0.85
      source: historical_data
    - step: 2
      event: 科技股/半导体板块下跌
      lag_days: 1
      magnitude: {base: -8, range: [-4, -15]}
      confidence: 0.80
      source: historical_data
    - step: 3
      event: 企业资本支出削减，供应链重组启动
      lag_days: 60
      magnitude: {base: -2, range: [-1, -4]}
      confidence: 0.65
      source: historical_data
    - step: 4
      event: 通胀上行（进口成本转嫁消费端）
      lag_days: 90
      magnitude: {base: 0.5, range: [0.2, 1.2]}
      confidence: 0.60
      source: historical_data
  dampening_factors:
    - factor: 双边谈判进展
      scale: 0.6
    - factor: 企业快速调整供应链
      scale: 0.75
  amplifying_factors:
    - factor: 金融脱钩（SWIFT/美元结算）
      scale: 2.0
    - factor: 盟友跟进制裁
      scale: 1.5
  historical_instances:
    - event: 2018-19 中美贸易战
      outcome: SPX -20%（2018Q4），随后 2019 缓和后反弹 30%
      verified: true
    - event: 2022-23 半导体出口管制
      outcome: 中国芯片股跌 30-50%，全球半导体板块调整
      verified: true
  notes: "关税→供应链→通胀传导有充分数据，金融脱钩部分为推断。"

- id: trade_tariff_escalation
  scenario_type: TRADE
  subtype: TARIFF
  label: 关税升级 → 供应链重构 → 通胀
  calibration_score: 0.65
  data_quality: 2018-19 / 2025 关税战验证
  causal_chain:
    - step: 1
      event: 关税宣布（10%-25% 范围）
      lag_days: 0
      magnitude: {base: -4, range: [-2, -8]}
      confidence: 0.80
      source: historical_data
    - step: 2
      event: 进口成本上升，企业盈利预警
      lag_days: 30
      magnitude: {base: -3, range: [-1, -6]}
      confidence: 0.75
      source: historical_data
    - step: 3
      event: CPI 上行（供给侧推动通胀）
      lag_days: 90
      magnitude: {base: 0.4, range: [0.1, 1.0]}
      confidence: 0.65
      source: historical_data
    - step: 4
      event: Fed 更趋鹰派（或延迟降息）
      lag_days: 120
      magnitude: {base: 0.3, range: [0.1, 0.8]}
      confidence: 0.55
      source: historical_data
  dampening_factors:
    - factor: 贸易协定签署/关税豁免
      scale: 0.5
    - factor: 美元走强抵消进口价格上涨
      scale: 0.75
  amplifying_factors:
    - factor: 双向报复升级
      scale: 1.6
    - factor: 叠加供给冲击（能源/粮食）
      scale: 1.8
  historical_instances:
    - event: 2018-19 中美贸易战
      outcome: 通胀小幅上行（~0.3%），主要冲击在市场情绪和企业投资
      verified: true
    - event: 2025 关税战（145%/125%）
      outcome: 进行中，日内瓦峰会后暂停 90 天
      verified: false
  notes: ""

