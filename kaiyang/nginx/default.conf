# kaiyang nginx — 静态站点缓存策略（2026-08-05 WorkBuddy）
# index.html 不缓存：每次刷新拿到最新引用（bundle 文件名带 hash，天然防缓存）
# /assets/ hash 命名资源：immutable 长缓存（内容不变则 URL 不变）
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /data/ = 天枢实时数据挂载（嵌套 bind mount 遮蔽 dist/data），禁 SPA fallback（2026-08-06 P1 修复）
    # 原 location / 的 try_files 兜底 /index.html 覆盖 /data/ → 不存在的文件假 200（dashboard.html 幻影）
    location /data/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    error_page   500 502 503 504  /50x.html;
}
