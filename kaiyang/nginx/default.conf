        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/tianji_trigger.json {
        alias /usr/share/nginx/data/tianji_trigger.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/tianxuan_grv.json {
        alias /usr/share/nginx/data/tianxuan_grv.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── 动态目录（清单驱动：文件名由 index/manifest 在运行时拼接，无法穷举）──
    # 依据：nginx 历史日志中 browser UA 请求过的路径（已排除 curl 自测流量）
    location ^~ /data/reports/ {
        alias /usr/share/nginx/data/reports/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /data/fred_history/ {
        alias /usr/share/nginx/data/fred_history/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /data/commodity_history/ {
        alias /usr/share/nginx/data/commodity_history/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── 单文件（组件直接 fetch，未在 dataSources registry 中）──
    location = /data/fci_daily.csv {
        alias /usr/share/nginx/data/fci_daily.csv;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 兜底：以上白名单与动态目录之外一律 404
    # （普通前缀；勿用 ^~ —— 会屏蔽精确匹配使白名单全失效）
    location /data/ {
        return 404;
    }

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
    error_page   500 502 503 504  /50x.html;
}
