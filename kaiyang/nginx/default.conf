    }

    location = /data/nuclear_sites.json {
        alias /usr/share/nginx/data/nuclear_sites.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/reports_index.json {
        alias /usr/share/nginx/data/reports_index.json;
