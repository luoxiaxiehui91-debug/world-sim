# kaiyang nginx — 静态站点缓存策略（2026-08-05 WorkBuddy）
# index.html 不缓存：每次刷新拿到最新引用（bundle 文件名带 hash，天然防缓存）
# /assets/ hash 命名资源：immutable 长缓存（内容不变则 URL 不变）
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /data/ = 天枢实时数据挂载（嵌套 bind mount 遮蔽 dist/data），禁 SPA fallback（2026-08-06 P1 修复）
    # 原 location / 的 try_files 兜底 /index.html 覆盖 /data/ → 不存在的文件假 200（dashboard.html 幻影）
    # CHG-20261001T144635：收敛为白名单（前端 bundle 实际请求的 29 个固定 path，3.46 MB）
    # 原为 alias 整个 data 目录（444 文件 / 638.9 MB）零鉴权可读 → 收窄 99.46%
    # 精确匹配 location = 优先级最高；兜底用普通前缀（勿用 ^~，会屏蔽精确匹配）

    location = /data/airroutes.json {
        alias /usr/share/nginx/data/airroutes.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/airtraffic_opensky.json {
        alias /usr/share/nginx/data/airtraffic_opensky.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/climate_signals.json {
        alias /usr/share/nginx/data/climate_signals.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/disaster_signals.json {
        alias /usr/share/nginx/data/disaster_signals.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/earthquake_risk.json {
        alias /usr/share/nginx/data/earthquake_risk.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/energy_risk.json {
        alias /usr/share/nginx/data/energy_risk.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/fci_latest.json {
        alias /usr/share/nginx/data/fci_latest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/firms_fire.json {
        alias /usr/share/nginx/data/firms_fire.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/fred_history/GSCPI.csv {
        alias /usr/share/nginx/data/fred_history/GSCPI.csv;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/fred_history/manifest.json {
        alias /usr/share/nginx/data/fred_history/manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/grv_latest.json {
        alias /usr/share/nginx/data/grv_latest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/hdx_risk.json {
        alias /usr/share/nginx/data/hdx_risk.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/health_geo.json {
        alias /usr/share/nginx/data/health_geo.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/market_quotes.json {
        alias /usr/share/nginx/data/market_quotes.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/news_all.json {
        alias /usr/share/nginx/data/news_all.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/news_export.json {
        alias /usr/share/nginx/data/news_export.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/news_geo.json {
        alias /usr/share/nginx/data/news_geo.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/news_risk.json {
        alias /usr/share/nginx/data/news_risk.json;
