    }

    location = /data/safecast_nuke.json {
        alias /usr/share/nginx/data/safecast_nuke.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/sdr_summary.json {
        alias /usr/share/nginx/data/sdr_summary.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /data/sim_trigger.json {
        alias /usr/share/nginx/data/sim_trigger.json;
