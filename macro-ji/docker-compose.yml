# macro-ji — 天玑独立容器（验证评估层，北斗七星第三星）
# M1 已采纳：独立 compose，不挂在 macro-sim 下。天玑启动/停止/重建独立于天璇。
services:
  tianji:
    image: macro-tianji:latest
    container_name: macro-scan-tianji-1
    restart: unless-stopped
    networks:
      - default
      - worldsim_default
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - VERIFY_LLM_MODEL=deepseek-ai/DeepSeek-V4-Flash
      - OPENCLAW_WORKSPACE=/app
      - TIANJI_DATA_DIR=/app/macro_data
      - FRED_API_KEY=${FRED_API_KEY}
      - NTFY_URL=${NTFY_URL}
      - WORLDSIM_APP_PW=${WORLDSIM_APP_PW}
      - TZ=Asia/Shanghai
    volumes:
      # 目录挂载铁律：读天枢 data（forecast_tracker.db / fred_history/ / grv_history.jsonl）
      # 禁单文件 bind mount（闸二）；与天璇 macro-sim 共用同一挂载源（同卷不同容器）
      - /vol2/1000/software/macro-scan/data:/app/macro_data:rw
      # config 目录（grv_weights.yaml / prior.yaml —— weight_matrix 与 tianji_verifier 依赖）
      - /vol2/1000/software/macro-scan/config:/app/config:rw
      - /vol2/1000/software/macro-scan/知识库:/app/知识库:ro

  verify-cron:
    image: macro-tianji:latest
    container_name: macro-scan-tianji-cron-1
    restart: unless-stopped
    depends_on:
      - tianji
    networks:
      - default
      - worldsim_default
    environment:
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - OPENCLAW_WORKSPACE=/app
      - TIANJI_DATA_DIR=/app/macro_data
      - WORLDSIM_APP_PW=${WORLDSIM_APP_PW}
      - TZ=Asia/Shanghai
    volumes:
      - /vol2/1000/software/macro-scan/data:/app/macro_data:rw
      - /vol2/1000/software/macro-scan/config:/app/config:rw
      - /vol2/1000/software/macro-scan/知识库:/app/知识库:ro
      # WIKI_FILE 路径兼容：verify_hypothesis 按 WORKSPACE/data 找 scenario_wiki.md
      - /vol2/1000/software/macro-scan/data:/app/data:ro
    command: ["python3", "tianji_verify_cron.py"]
    healthcheck:
      # 08-18 P0-1 强化：真实 PG 连接（此前仅 import 模块 → env 空也 healthy 假象）
      test: ["CMD", "python3", "-c", "import tianji_db; conn = tianji_db.get_connection(); conn.close(); print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 无端口；触发机制 = T2 共享触发文件（scheduler 写 trigger → watchdog 轮询）

networks:
  worldsim_default:
    external: true
